name: Upload Pages artifact (organization-pinned)
description: Prepare the repository's static files as a GitHub Pages artifact using a SHA-pinned upload-artifact action.
inputs:
  path:
    description: Directory containing static assets
    required: false
    default: .
  name:
    description: Artifact name
    required: false
    default: github-pages
  retention-days:
    description: Artifact retention period
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - name: Archive artifact
      shell: sh
      run: |
        tar --dereference --hard-dereference --directory "$INPUT_PATH" -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      env:
        INPUT_PATH: ${{ inputs.path }}
    - name: Upload artifact
      id: upload-artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/artifact.tar
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
outputs:
  artifact_id:
    description: Uploaded artifact ID
    value: ${{ steps.upload-artifact.outputs.artifact-id }}
